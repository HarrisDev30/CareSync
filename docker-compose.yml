services:
  postgres:
    image: postgres:16-alpine
    container_name: caresync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-caresync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caresync_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-caresync_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caresync} -d ${DB_NAME:-caresync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caresync-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-caresync_redis_pass_2026}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-caresync_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

